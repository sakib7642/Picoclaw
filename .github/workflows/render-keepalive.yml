name: Keep Render PicoClaw awake

on:
  schedule:
    # Render Free sleeps after 15 minutes without inbound traffic.
    # Ten minutes gives a safety margin while keeping request volume low.
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake/check PicoClaw with retries
        shell: bash
        run: |
          set -u
          url='https://picoclaw-qap4.onrender.com/'
          for attempt in 1 2 3 4 5 6 7 8; do
            echo "Keepalive attempt ${attempt}/8"
            code="$(curl -sS -o /tmp/render-response.txt -w '%{http_code}' --connect-timeout 10 --max-time 70 "$url" || true)"
            echo "HTTP ${code}"
            if [[ "$code" =~ ^2[0-9][0-9]$|^3[0-9][0-9]$ ]]; then
              echo 'PicoClaw is reachable.'
              exit 0
            fi
            if [ "$attempt" -lt 8 ]; then
              sleep 15
            fi
          done
          echo 'PicoClaw did not return a healthy HTTP response after retries.' >&2
          exit 1
